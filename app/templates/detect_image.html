{% extends "base.html" %}
{% block title %}出入场登记 - {{ app_name }}{% endblock %}
{% block heading %}<h1>出入场登记</h1>{% endblock %}
{% block content %}
<section class="workspace-grid">
    <div class="panel detect-workspace">
        <div class="panel-heading"><div><h2>识别车辆车牌</h2></div></div>
        <label class="upload-zone" id="dropZone" for="imageInput">
            <input id="imageInput" type="file" accept="image/*" hidden>
            <span class="upload-symbol">＋</span><strong>选择或拖入图片</strong><small>图片不超过 10 兆</small>
        </label>
        <div class="image-stage hidden" id="imageStage"><img id="preview" alt="待检测图片"></div>
        <div class="action-row"><button class="button primary" id="detectButton" type="button" disabled>开始识别</button><button class="button secondary hidden" id="resetButton" type="button">重新选择</button></div>
        <div class="progress hidden" id="loading"><span></span>正在执行车牌定位与字符识别</div>
    </div>
    <aside class="panel result-panel">
        <div class="panel-heading"><div><h2>检测结果</h2></div></div>
        <div id="result"><div class="empty-state tall">检测结果将在这里显示</div></div>
    </aside>
</section>
{% endblock %}
{% block scripts %}<script src="/static/js/detect.js?v=20261023-cn"></script>{% endblock %}
